<script>

/* ============================================================
   YOUTUBE CHANNEL ID FINDER
   Browser-only / no API key / no Worker
   ============================================================ */


const $ = id => document.getElementById(id);

const input = $("input");
const findButton = $("find");
const result = $("result");
const channelIdBox = $("channelId");
const channelNameBox = $("channelName");
const copyButton = $("copy");

const debugToggle = $("debugToggle");
const debugBox = $("debug");
const debugLog = $("debugLog");
const clearDebug = $("clearDebug");
const copyDebug = $("copyDebug");


/* ============================================================
   DEBUG LOGGER
   ============================================================ */

let debugLines = [];

function log(message, type = "info") {

    const time = new Date().toLocaleTimeString();

    const line =
        `[${time}] ${message}`;

    debugLines.push(line);

    const div = document.createElement("div");

    div.className = `log ${type}`;

    div.textContent = line;

    debugLog.appendChild(div);

    debugLog.scrollTop =
        debugLog.scrollHeight;

    console.log(line);
}


/* ============================================================
   VALID CHANNEL ID
   ============================================================ */

function isChannelId(value) {

    return /^UC[a-zA-Z0-9_-]{22}$/.test(value);

}


/* ============================================================
   EXTRACT UC ID FROM ANY TEXT
   ============================================================ */

function extractChannelId(text) {

    if (!text) return null;

    /*
       Most useful first:

       externalId = page's OWN channel.
    */

    const externalPatterns = [

        /"externalId"\s*:\s*"(UC[a-zA-Z0-9_-]{22})"/,

        /\\"externalId\\"\s*:\s*\\"(UC[a-zA-Z0-9_-]{22})\\"/,

        /externalId[^A-Za-z0-9_-]{1,20}(UC[a-zA-Z0-9_-]{22})/i

    ];


    for (const regex of externalPatterns) {

        const match =
            text.match(regex);

        if (
            match &&
            isChannelId(match[1])
        ) {

            return match[1];

        }

    }


    /*
       Canonical channel URL.
    */

    const channelURL =
        text.match(
            /\/channel\/(UC[a-zA-Z0-9_-]{22})/
        );

    if (channelURL) {

        return channelURL[1];

    }


    /*
       channelId field.
    */

    const channelIdPatterns = [

        /"channelId"\s*:\s*"(UC[a-zA-Z0-9_-]{22})"/,

        /\\"channelId\\"\s*:\s*\\"(UC[a-zA-Z0-9_-]{22})\\"/,

        /channelId[^A-Za-z0-9_-]{1,20}(UC[a-zA-Z0-9_-]{22})/i

    ];


    for (const regex of channelIdPatterns) {

        const match =
            text.match(regex);

        if (
            match &&
            isChannelId(match[1])
        ) {

            return match[1];

        }

    }


    /*
       Last resort:
       Find UC IDs anywhere.

       NOTE:
       This is less trustworthy than externalId.
    */

    const all =
        text.match(
            /UC[a-zA-Z0-9_-]{22}/g
        );

    if (all && all.length) {

        return all[0];

    }


    return null;
}


/* ============================================================
   CLEAN INPUT
   ============================================================ */

function parseInput(raw) {

    raw = raw.trim();

    if (!raw) {

        throw new Error(
            "Nothing was entered."
        );

    }


    /*
       Already a UC ID
    */

    if (isChannelId(raw)) {

        return {
            type: "channel",
            url: null,
            value: raw
        };

    }


    /*
       Add protocol to URLs.
    */

    let value = raw;

    if (
        /^www\.youtube\.com/i.test(value)
    ) {
        value =
            "https://" + value;
    }

    if (
        /^youtube\.com/i.test(value)
    ) {
        value =
            "https://" + value;
    }


    /*
       Full URL
    */

    if (
        /^https?:\/\//i.test(value)
    ) {

        let url;

        try {

            url =
                new URL(value);

        } catch {

            throw new Error(
                "That does not look like a valid URL."
            );

        }


        /*
           /channel/UC...
        */

        const channelMatch =
            url.pathname.match(
                /\/channel\/(UC[a-zA-Z0-9_-]{22})/
            );

        if (channelMatch) {

            return {
                type: "channel",
                url: url.href,
                value: channelMatch[1]
            };

        }


        /*
           Video URL
        */

        const video =
            extractVideoId(url);

        if (video) {

            return {
                type: "video",
                url: url.href,
                value: video
            };

        }


        /*
           Handle / custom / user URL
        */

        if (
            url.pathname.startsWith("/@") ||
            url.pathname.startsWith("/c/") ||
            url.pathname.startsWith("/user/")
        ) {

            return {
                type: "channel",
                url: url.href,
                value: url.href
            };

        }


        return {
            type: "channel",
            url: url.href,
            value: url.href
        };

    }


    /*
       Bare @handle
    */

    let handle =
        value.replace(/^@/, "");

    handle =
        handle.split(/[/?#]/)[0];

    if (!handle) {

        throw new Error(
            "Invalid handle."
        );

    }


    return {
        type: "channel",
        url:
            `https://www.youtube.com/@${encodeURIComponent(handle)}`,
        value: handle
    };

}


/* ============================================================
   VIDEO ID EXTRACTION
   ============================================================ */

function extractVideoId(url) {

    try {

        const u =
            typeof url === "string"
                ? new URL(url)
                : url;


        /*
           youtube.com/watch?v=
        */

        if (
            u.hostname.includes("youtube.com") &&
            u.searchParams.get("v")
        ) {

            return u.searchParams.get("v");

        }


        /*
           youtu.be/VIDEO
        */

        if (
            u.hostname === "youtu.be"
        ) {

            return u.pathname
                .split("/")
                .filter(Boolean)[0] || null;

        }


        /*
           Shorts
        */

        const shorts =
            u.pathname.match(
                /\/shorts\/([^/?#]+)/
            );

        if (shorts) {

            return shorts[1];

        }


        /*
           Embed
        */

        const embed =
            u.pathname.match(
                /\/embed\/([^/?#]+)/
            );

        if (embed) {

            return embed[1];

        }


        /*
           Live
        */

        const live =
            u.pathname.match(
                /\/live\/([^/?#]+)/
            );

        if (live) {

            return live[1];

        }

    } catch {}

    return null;
}


/* ============================================================
   FETCH WITH TIMEOUT
   ============================================================ */

async function fetchText(
    url,
    options = {},
    timeout = 8000
) {

    const controller =
        new AbortController();

    const timer =
        setTimeout(
            () => controller.abort(),
            timeout
        );

    try {

        const response =
            await fetch(
                url,
                {
                    ...options,
                    signal:
                        controller.signal
                }
            );

        const text =
            await response.text();

        return {
            ok: response.ok,
            status: response.status,
            text,
            headers: response.headers
        };

    } finally {

        clearTimeout(timer);

    }

}


/* ============================================================
   METHOD 1
   DIRECT YOUTUBE PAGE
   ============================================================ */

async function tryDirectYouTube(url) {

    log(
        "METHOD 1 — Direct YouTube page",
        "try"
    );

    const started =
        performance.now();

    try {

        const response =
            await fetchText(
                url,
                {
                    headers: {
                        "Accept":
                            "text/html,application/xhtml+xml"
                    }
                }
            );


        log(
            `HTTP ${response.status} • ${response.text.length} bytes`
        );


        const id =
            extractChannelId(
                response.text
            );


        if (id) {

            log(
                `SUCCESS — found ${id}`,
                "success"
            );

            return {
                id,
                method:
                    "Direct YouTube page"
            };

        }


        log(
            `No channel ID found (${Math.round(performance.now() - started)}ms)`,
            "fail"
        );

    } catch (error) {

        log(
            `FAILED — ${error.name}: ${error.message}`,
            "fail"
        );

    }

    return null;
}


/* ============================================================
   METHOD 2
   CORS.PROXY
   ============================================================ */

async function tryCorsProxy(url) {

    const proxy =
        "https://corsproxy.io/?" +
        encodeURIComponent(url);

    log(
        "METHOD 2 — corsproxy.io",
        "try"
    );

    try {

        const response =
            await fetchText(
                proxy,
                {},
                10000
            );


        log(
            `HTTP ${response.status} • ${response.text.length} bytes`
        );


        const id =
            extractChannelId(
                response.text
            );


        if (id) {

            log(
                `SUCCESS — found ${id}`,
                "success"
            );

            return {
                id,
                method:
                    "corsproxy.io"
            };

        }


        log(
            "Proxy responded, but no ID was found.",
            "fail"
        );

    } catch (error) {

        log(
            `FAILED — ${error.name}: ${error.message}`,
            "fail"
        );

    }

    return null;
}


/* ============================================================
   METHOD 3
   ALLORIGINS
   ============================================================ */

async function tryAllOrigins(url) {

    const proxy =
        "https://api.allorigins.win/raw?url=" +
        encodeURIComponent(url);

    log(
        "METHOD 3 — AllOrigins",
        "try"
    );

    try {

        const response =
            await fetchText(
                proxy,
                {},
                10000
            );


        log(
            `HTTP ${response.status} • ${response.text.length} bytes`
        );


        const id =
            extractChannelId(
                response.text
            );


        if (id) {

            log(
                `SUCCESS — found ${id}`,
                "success"
            );

            return {
                id,
                method:
                    "AllOrigins"
            };

        }


        log(
            "No ID found in AllOrigins response.",
            "fail"
        );

    } catch (error) {

        log(
            `FAILED — ${error.name}: ${error.message}`,
            "fail"
        );

    }

    return null;
}


/* ============================================================
   METHOD 4
   R.JINA.AI READER
   ============================================================ */

async function tryJina(url) {

    const proxy =
        "https://r.jina.ai/" + url;

    log(
        "METHOD 4 — Jina Reader",
        "try"
    );

    try {

        const response =
            await fetchText(
                proxy,
                {},
                12000
            );


        log(
            `HTTP ${response.status} • ${response.text.length} bytes`
        );


        const id =
            extractChannelId(
                response.text
            );


        if (id) {

            log(
                `SUCCESS — found ${id}`,
                "success"
            );

            return {
                id,
                method:
                    "Jina Reader"
            };

        }


        log(
            "Jina responded but no ID was detected.",
            "fail"
        );

    } catch (error) {

        log(
            `FAILED — ${error.name}: ${error.message}`,
            "fail"
        );

    }

    return null;
}


/* ============================================================
   METHOD 5
   GOOGLE WEB CACHE STYLE SEARCH
   ============================================================ */

async function tryGoogleCacheStyle(url) {

    /*
       This is intentionally only a best-effort
       public fetch route.

       It does NOT use an API key.
    */

    const target =
        "https://r.jina.ai/http://r.jina.ai/http://" +
        url.replace(/^https?:\/\//, "");

    log(
        "METHOD 5 — secondary public reader route",
        "try"
    );

    try {

        const response =
            await fetchText(
                target,
                {},
                10000
            );


        log(
            `HTTP ${response.status} • ${response.text.length} bytes`
        );


        const id =
            extractChannelId(
                response.text
            );


        if (id) {

            log(
                `SUCCESS — found ${id}`,
                "success"
            );

            return {
                id,
                method:
                    "Secondary public reader"
            };

        }


        log(
            "No ID found.",
            "fail"
        );

    } catch (error) {

        log(
            `FAILED — ${error.name}: ${error.message}`,
            "fail"
        );

    }

    return null;
}


/* ============================================================
   VIDEO → OEmbed → AUTHOR URL
   ============================================================ */

async function tryVideoOEmbed(videoId) {

    log(
        "VIDEO FALLBACK — YouTube oEmbed",
        "try"
    );


    const videoURL =
        `https://www.youtube.com/watch?v=${encodeURIComponent(videoId)}`;


    const endpoints = [

        "https://www.youtube.com/oembed?format=json&url=",

        "https://noembed.com/embed?url="

    ];


    for (
        const endpoint of endpoints
    ) {

        log(
            `Trying ${endpoint.split("?")[0]}`
        );

        try {

            const response =
                await fetchText(
                    endpoint +
                    encodeURIComponent(videoURL),
                    {},
                    8000
                );


            log(
                `HTTP ${response.status} • ${response.text.length} bytes`
            );


            if (!response.ok) {

                continue;

            }


            let data;

            try {

                data =
                    JSON.parse(
                        response.text
                    );

            } catch {

                continue;

            }


            log(
                `Author: ${data.author_name || "unknown"}`
            );


            /*
               author_url is often /user/
               or another canonical YouTube URL.
            */

            if (
                data.author_url
            ) {

                log(
                    "Author URL found: " +
                    data.author_url,
                    "success"
                );


                /*
                   First try direct extraction
                   from the author URL.
                */

                const direct =
                    extractChannelId(
                        data.author_url
                    );


                if (direct) {

                    return {
                        id: direct,
                        method:
                            "Video oEmbed author URL"
                    };

                }


                /*
                   Then run page/proxy methods
                   against author URL.
                */

                const attempts = [

                    () =>
                        tryDirectYouTube(
                            data.author_url
                        ),

                    () =>
                        tryCorsProxy(
                            data.author_url
                        ),

                    () =>
                        tryAllOrigins(
                            data.author_url
                        ),

                    () =>
                        tryJina(
                            data.author_url
                        )

                ];


                for (
                    const attempt of attempts
                ) {

                    const result =
                        await attempt();

                    if (result) {
                        return result;
                    }

                }

            }

        } catch (error) {

            log(
                `oEmbed failed — ${error.message}`,
                "fail"
            );

        }

    }

    return null;
}


/* ============================================================
   HANDLE → VIDEO SEARCH FALLBACK
   ============================================================ */

async function tryHandleWithPublicSearch(handle) {

    /*
       We don't treat a search result as definitive.
       This is only another route to discover a video
       belonging to the requested handle.
    */

    log(
        "METHOD 6 — public search fallback",
        "try"
    );

    const query =
        encodeURIComponent(
            `"@${handle}" site:youtube.com/watch`
        );

    const url =
        "https://www.google.com/search?q=" +
        query;

    try {

        const response =
            await fetchText(
                "https://r.jina.ai/" + url,
                {},
                10000
            );


        log(
            `Search reader HTTP ${response.status} • ${response.text.length} bytes`
        );


        const matches =
            response.text.match(
                /(?:https?:\/\/)?(?:www\.)?youtube\.com\/watch\?v=([a-zA-Z0-9_-]{11})/g
            );


        if (!matches || !matches.length) {

            log(
                "No YouTube video URLs discovered.",
                "fail"
            );

            return null;
        }


        log(
            `Found ${matches.length} possible video URL(s).`
        );


        for (
            const match of matches.slice(0, 5)
        ) {

            const videoId =
                match.match(
                    /v=([a-zA-Z0-9_-]{11})/
                )?.[1];


            if (!videoId) continue;


            log(
                "Trying discovered video: " +
                videoId
            );


            const result =
                await tryVideoOEmbed(
                    videoId
                );


            if (result) {

                return result;

            }

        }

    } catch (error) {

        log(
            `Search fallback failed — ${error.message}`,
            "fail"
        );

    }

    return null;
}


/* ============================================================
   MAIN RESOLVER
   ============================================================ */

async function resolve(raw) {

    const parsed =
        parseInput(raw);


    log(
        `Input type detected: ${parsed.type}`
    );


    /*
       Already known ID
    */

    if (
        parsed.type === "channel" &&
        isChannelId(parsed.value)
    ) {

        return {
            id: parsed.value,
            method:
                "Input already contained channel ID"
        };

    }


    /*
       VIDEO
    */

    if (
        parsed.type === "video"
    ) {

        return await tryVideoOEmbed(
            parsed.value
        );

    }


    /*
       CHANNEL URL
    */

    const url =
        parsed.url;


    /*
       Run multiple independent routes.
    */

    const methods = [

        () =>
            tryDirectYouTube(url),

        () =>
            tryCorsProxy(url),

        () =>
            tryAllOrigins(url),

        () =>
            tryJina(url),

        () =>
            tryGoogleCacheStyle(url)

    ];


    for (
        const method of methods
    ) {

        const result =
            await method();

        if (result) {

            return result;

        }

    }


    /*
       If it is a bare handle, attempt
       indirect discovery.
    */

    if (
        !/^https?:\/\//i.test(
            parsed.value
        )
    ) {

        return await tryHandleWithPublicSearch(
            parsed.value
        );

    }


    return null;
}


/* ============================================================
   DISPLAY RESULT
   ============================================================ */

function showResult(data) {

    result.style.display =
        "block";

    channelIdBox.className =
        "channel-id";

    channelIdBox.textContent =
        data.id;

    channelNameBox.textContent =
        data.method
            ? "Resolved via " + data.method
            : "";

}


/* ============================================================
   DISPLAY ERROR
   ============================================================ */

function showError(message) {

    result.style.display =
        "block";

    channelIdBox.className =
        "channel-id error";

    channelIdBox.textContent =
        message;

    channelNameBox.textContent =
        "";

}


/* ============================================================
   FIND BUTTON
   ============================================================ */

async function findChannel() {

    const raw =
        input.value.trim();


    result.style.display =
        "none";


    if (!raw) {

        input.focus();

        return;

    }


    findButton.disabled =
        true;

    findButton.textContent =
        "Searching...";


    log("");
    log("======================================");
    log("STARTING NEW LOOKUP");
    log("======================================");
    log("Input: " + raw);


    const started =
        performance.now();


    try {

        const resultData =
            await resolve(raw);


        if (resultData) {

            showResult(
                resultData
            );


            log("");
            log(
                "======================================"
            );

            log(
                "FINAL RESULT: " +
                resultData.id,
                "success"
            );

            log(
                "Successful method: " +
                resultData.method,
                "success"
            );

            log(
                "Total time: " +
                Math.round(
                    performance.now() -
                    started
                ) +
                "ms",
                "success"
            );

            log(
                "======================================",
                "success"
            );


        } else {

            showError(
                "Could not resolve this channel."
            );


            log("");
            log(
                "ALL METHODS FAILED.",
                "fail"
            );

            log(
                "Try pasting a video/Short URL from the channel.",
                "warn"
            );

        }

    } catch (error) {

        console.error(error);


        showError(
            error.message ||
            "Lookup failed."
        );


        log(
            "FATAL ERROR: " +
            error.message,
            "fail"
        );

    } finally {

        findButton.disabled =
            false;

        findButton.textContent =
            "Find ID";

    }

}


/* ============================================================
   COPY
   ============================================================ */

copyButton.addEventListener(
    "click",
    async () => {

        const id =
            channelIdBox.textContent;


        if (
            !id ||
            !isChannelId(id)
        ) {

            return;

        }


        try {

            await navigator.clipboard.writeText(
                id
            );

            copyButton.textContent =
                "Copied!";

            setTimeout(
                () => {
                    copyButton.textContent =
                        "Copy Channel ID";
                },
                1200
            );

        } catch {

            log(
                "Clipboard permission denied.",
                "fail"
            );

        }

    }
);


/* ============================================================
   EVENTS
   ============================================================ */

findButton.addEventListener(
    "click",
    findChannel
);


input.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter"
        ) {

            findChannel();

        }

    }
);


/* ============================================================
   DEBUG TOGGLE
   ============================================================ */

debugToggle.addEventListener(
    "click",
    () => {

        const open =
            debugBox.style.display === "block";


        debugBox.style.display =
            open
                ? "none"
                : "block";


        debugToggle.textContent =
            open
                ? "Show Debug Console"
                : "Hide Debug Console";

    }
);


/* ============================================================
   CLEAR DEBUG
   ============================================================ */

clearDebug.addEventListener(
    "click",
    () => {

        debugLines = [];

        debugLog.innerHTML = "";

        log(
            "Debug console cleared."
        );

    }
);


/* ============================================================
   COPY DEBUG
   ============================================================ */

copyDebug.addEventListener(
    "click",
    async () => {

        try {

            await navigator.clipboard.writeText(
                debugLines.join("\n")
            );

            copyDebug.textContent =
                "Copied!";

            setTimeout(
                () => {
                    copyDebug.textContent =
                        "Copy";
                },
                1000
            );

        } catch {

            log(
                "Could not copy debug log.",
                "fail"
            );

        }

    }
);


/* ============================================================
   INITIALIZATION
   ============================================================ */

log(
    "Resolver loaded."
);

log(
    "No API key required."
);

log(
    "No Worker required."
);

log(
    "Ready."
);

</script>
