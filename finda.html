<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TikTok Profile Lookup</title>
<style>
  :root {
    --bg: #0b0e14;
    --card: #12161f;
    --card2: #171c27;
    --border: #232a38;
    --text: #e8ecf3;
    --muted: #8b94a7;
    --accent: #fe2c55;
    --accent2: #25f4ee;
    --green: #3ddc84;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: radial-gradient(1200px 600px at 50% -10%, #16202e 0%, var(--bg) 55%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 16px 80px;
  }
  h1 { font-size: 28px; font-weight: 800; letter-spacing: -0.5px; }
  h1 .tt { color: var(--accent2); }
  h1 .x { color: var(--accent); }
  .sub { color: var(--muted); margin: 6px 0 26px; font-size: 14px; }

  .search {
    display: flex; gap: 10px; width: 100%; max-width: 460px; margin-bottom: 28px;
  }
  .search input {
    flex: 1; background: var(--card); border: 1px solid var(--border);
    color: var(--text); padding: 13px 16px; border-radius: 12px; font-size: 15px; outline: none;
    transition: border-color .15s;
  }
  .search input:focus { border-color: var(--accent2); }
  .search button {
    background: linear-gradient(135deg, var(--accent), #ff5c7a);
    border: none; color: #fff; font-weight: 700; font-size: 15px;
    padding: 0 22px; border-radius: 12px; cursor: pointer; transition: transform .1s, opacity .15s;
  }
  .search button:hover { opacity: .92; }
  .search button:active { transform: scale(.97); }
  .search button:disabled { opacity: .5; cursor: default; }

  .msg { color: var(--muted); font-size: 14px; margin-bottom: 16px; min-height: 20px; }
  .msg.error { color: #ff7a8a; }

  /* ---- profile card ---- */
  .card {
    width: 100%; max-width: 460px; background: var(--card);
    border: 1px solid var(--border); border-radius: 18px; overflow: hidden;
    display: none;
    box-shadow: 0 20px 60px rgba(0,0,0,.45);
  }
  .card.show { display: block; animation: pop .25s ease; }
  @keyframes pop { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  .banner {
    height: 110px;
    background: linear-gradient(120deg, #0d1b2e 0%, #123 40%, #0a2540 100%);
    position: relative;
  }
  .banner::after {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(400px 120px at 80% 0%, rgba(37,244,238,.18), transparent 60%),
                radial-gradient(300px 120px at 10% 100%, rgba(254,44,85,.18), transparent 60%);
  }
  .avatar-wrap { display: flex; justify-content: flex-end; padding: 0 20px; }
  .avatar {
    width: 92px; height: 92px; border-radius: 50%; object-fit: cover;
    border: 4px solid var(--card); margin-top: -46px; background: var(--card2);
    position: relative; z-index: 2;
  }
  .head { padding: 10px 20px 4px; }
  .nickname { font-size: 22px; font-weight: 800; display: flex; align-items: center; gap: 7px; }
  .badge { width: 18px; height: 18px; flex: none; }
  .handle { color: var(--muted); font-size: 14px; margin-top: 2px; }

  .stats {
    display: flex; gap: 0; margin: 16px 20px 0; background: var(--card2);
    border: 1px solid var(--border); border-radius: 14px; overflow: hidden;
  }
  .stat { flex: 1; text-align: center; padding: 13px 4px; }
  .stat + .stat { border-left: 1px solid var(--border); }
  .stat .label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; }
  .stat .value { font-size: 18px; font-weight: 800; margin-top: 3px; }

  .section { padding: 14px 20px; }
  .section h3 {
    font-size: 11px; color: var(--muted); text-transform: uppercase;
    letter-spacing: .8px; margin-bottom: 6px;
  }
  .bio { font-size: 14px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
  .bio a { color: var(--accent2); text-decoration: none; }

  .rows { border-top: 1px solid var(--border); }
  .row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 20px; font-size: 14px;
  }
  .row + .row { border-top: 1px solid var(--border); }
  .row .k { color: var(--muted); display: flex; align-items: center; gap: 8px; }
  .row .v { font-weight: 600; text-align: right; }
  .row .v a { color: var(--accent2); text-decoration: none; }
  .pill {
    display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700;
    padding: 3px 10px; border-radius: 999px;
  }
  .pill.yes { background: rgba(61,220,132,.12); color: var(--green); }
  .pill.no { background: rgba(139,148,167,.12); color: var(--muted); }

  .footer { margin-top: 26px; color: var(--muted); font-size: 12px; text-align: center; }
  .footer code { background: var(--card2); padding: 2px 7px; border-radius: 6px; font-size: 11px; }

  .spinner {
    width: 18px; height: 18px; border: 2px solid var(--border);
    border-top-color: var(--accent2); border-radius: 50%;
    display: inline-block; animation: spin .7s linear infinite; vertical-align: -4px; margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
<script src="https://sites.super.myninja.ai/_assets/ninja-daytona-script.js"></script>
</head>
<body>

<h1><span class="tt">TikTok</span> <span class="x">Lookup</span></h1>
<div class="sub">Enter a username to fetch public profile data</div>

<div class="search">
  <input id="username" type="text" placeholder="e.g. tiktok" autocomplete="off" spellcheck="false" />
  <button id="go">Search</button>
</div>

<div class="msg" id="msg"></div>

<div class="card" id="card">
  <div class="banner"></div>
  <div class="avatar-wrap"><img class="avatar" id="avatar" alt="" /></div>
  <div class="head">
    <div class="nickname"><span id="nickname"></span><span id="badge"></span></div>
    <div class="handle" id="handle"></div>
  </div>

  <div class="stats">
    <div class="stat"><div class="label">Followers</div><div class="value" id="followers">–</div></div>
    <div class="stat"><div class="label">Following</div><div class="value" id="following">–</div></div>
    <div class="stat"><div class="label">Likes</div><div class="value" id="likes">–</div></div>
    <div class="stat"><div class="label">Videos</div><div class="value" id="videos">–</div></div>
  </div>

  <div class="section" id="bioSection">
    <h3>Bio</h3>
    <div class="bio" id="bio"></div>
  </div>

  <div class="rows">
    <div class="row" id="rowLink" style="display:none">
      <span class="k">🔗 Link</span><span class="v" id="bioLink"></span>
    </div>
    <div class="row">
      <span class="k">✔ Verified</span><span class="v" id="verified"></span>
    </div>
    <div class="row">
      <span class="k">📅 Created</span><span class="v" id="created"></span>
    </div>
    <div class="row" id="rowActive" style="display:none">
      <span class="k">🕒 Last Active</span><span class="v" id="lastActive"></span>
    </div>
    <div class="row" id="rowRegion" style="display:none">
      <span class="k">🌍 Region</span><span class="v" id="region"></span>
    </div>
    <div class="row">
      <span class="k">🔒 Private</span><span class="v" id="private"></span>
    </div>
    <div class="row">
      <span class="k">🆔 User ID</span><span class="v" id="uid" style="font-family:monospace;font-size:12px"></span>
    </div>
  </div>
</div>

<div class="footer">
  Powered by a Cloudflare Worker · set your worker URL in <code>WORKER_URL</code>
</div>

<script>
  // ⚠️ SET THIS to your deployed worker URL, e.g.:
  // const WORKER_URL = "https://tiktok-lookup.YOURNAME.workers.dev";
  const WORKER_URL = "https://finda.dtm2210.workers.dev/"; // leave empty to try direct fetch (may hit CORS)

  const $ = (id) => document.getElementById(id);
  const input = $("username"), btn = $("go"), msg = $("msg"), card = $("card");

  const fmt = (n) => {
    if (n == null) return "–";
    if (n >= 1e9) return (n / 1e9).toFixed(1).replace(/\.0$/, "") + "B";
    if (n >= 1e6) return (n / 1e6).toFixed(1).replace(/\.0$/, "") + "M";
    if (n >= 1e3) return (n / 1e3).toFixed(1).replace(/\.0$/, "") + "K";
    return n.toLocaleString();
  };
  const fmtFull = (n) => (n == null ? "–" : n.toLocaleString());

  // "x ago" like the reference image
  function timeAgo(ts) {
    const s = Math.floor(Date.now() / 1000) - ts;
    if (s < 60) return "just now";
    const m = Math.floor(s / 60);   if (m < 60) return m + (m === 1 ? " minute ago" : " minutes ago");
    const h = Math.floor(m / 60);   if (h < 24) return h + (h === 1 ? " hour ago" : " hours ago");
    const d = Math.floor(h / 24);   if (d < 30) return d + (d === 1 ? " day ago" : " days ago");
    const mo = Math.floor(d / 30);  if (mo < 12) return mo + (mo === 1 ? " month ago" : " months ago");
    const y = Math.floor(mo / 12);  return y + (y === 1 ? " year ago" : " years ago");
  }

  // 2-letter region code -> flag emoji
  function flag(code) {
    if (!code || code.length !== 2) return "";
    const c = code.toUpperCase();
    if (!/^[A-Z]{2}$/.test(c)) return "";
    return String.fromCodePoint(...[...c].map(ch => 127397 + ch.charCodeAt(0)));
  }

  const VERIFIED_SVG = `<svg class="badge" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" fill="#20D5EC"/><path d="M8 12.5l2.5 2.5L16 9.5" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

  function pill(v) {
    return v
      ? `<span class="pill yes">✓ Yes</span>`
      : `<span class="pill no">No</span>`;
  }

  function linkify(text) {
    const esc = text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    return esc.replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
  }

  async function lookup() {
    const username = input.value.trim().replace(/^@/, "");
    if (!username) { msg.textContent = "Enter a username first."; msg.className = "msg error"; return; }

    btn.disabled = true;
    card.classList.remove("show");
    msg.className = "msg";
    msg.innerHTML = `<span class="spinner"></span>Fetching @${username}…`;

    try {
      let data;
      if (WORKER_URL) {
        const res = await fetch(`${WORKER_URL}/?username=${encodeURIComponent(username)}`);
        data = await res.json();
        if (!data.ok) throw new Error(data.error || "Lookup failed");
        render(data.profile);
      } else {
        // Direct fallback (works if browser can reach TikTok without CORS issues — usually it can't,
        // so deploy the worker for reliable results)
        throw new Error("Set WORKER_URL to your deployed Cloudflare Worker first.");
      }
      msg.textContent = "";
    } catch (e) {
      msg.textContent = e.message;
      msg.className = "msg error";
    } finally {
      btn.disabled = false;
    }
  }

  function render(p) {
    $("avatar").src = p.avatar || "";
    $("nickname").textContent = p.nickname || p.username;
    $("badge").innerHTML = p.verified ? VERIFIED_SVG : "";
    $("handle").textContent = "@" + p.username;

    $("followers").textContent = fmt(p.followers);
    $("followers").title = fmtFull(p.followers);
    $("following").textContent = fmt(p.following);
    $("following").title = fmtFull(p.following);
    $("likes").textContent = fmt(p.likes);
    $("likes").title = fmtFull(p.likes);
    $("videos").textContent = fmt(p.videos);
    $("videos").title = fmtFull(p.videos);

    const bio = p.bio || "(no bio)";
    $("bio").innerHTML = linkify(bio);

    if (p.bioLink) {
      $("rowLink").style.display = "";
      const href = p.bioLink.startsWith("http") ? p.bioLink : "https://" + p.bioLink;
      $("bioLink").innerHTML = `<a href="${href}" target="_blank" rel="noopener">${p.bioLink}</a>`;
    } else {
      $("rowLink").style.display = "none";
    }

    $("verified").innerHTML = pill(p.verified);
    $("created").textContent = p.created
      ? new Date(p.created * 1000).toLocaleDateString(undefined, { year: "numeric", month: "long", day: "numeric" })
      : "Unknown";

    if (p.lastActive) {
      $("rowActive").style.display = "";
      const d = new Date(p.lastActive * 1000);
      $("lastActive").textContent = timeAgo(p.lastActive);
      $("lastActive").title = d.toLocaleString();
    } else {
      $("rowActive").style.display = "none";
    }

    if (p.region) {
      $("rowRegion").style.display = "";
      const code = p.region.toUpperCase();
      $("region").textContent = `${flag(code)} ${code}`.trim();
    } else {
      $("rowRegion").style.display = "none";
    }

    $("private").innerHTML = pill(p.private);
    $("uid").textContent = p.id || "–";

    card.classList.add("show");
  }

  btn.addEventListener("click", lookup);
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") lookup(); });
  input.focus();
</script>
</body>
</html>
